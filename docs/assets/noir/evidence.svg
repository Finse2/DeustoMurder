<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="DeustoMurder noir portfolio illustration">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060608"/><stop offset=".48" stop-color="#181015"/><stop offset="1" stop-color="#07070A"/></linearGradient>
 <linearGradient id="gold" x2="1" y2=".2"><stop stop-color="#6A4D34"/><stop offset=".32" stop-color="#D3B184"/><stop offset=".64" stop-color="#F5E1B7"/><stop offset="1" stop-color="#7B5337"/></linearGradient>
 <linearGradient id="blood" x2="1" y2=".4"><stop stop-color="#26070E"/><stop offset=".5" stop-color="#991E39"/><stop offset="1" stop-color="#360916"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8C2036" stop-opacity=".5"/><stop offset="1" stop-color="#8C2036" stop-opacity="0"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#A44752"/><stop offset=".65" stop-color="#72202F"/><stop offset="1" stop-color="#310916"/></radialGradient>
 <pattern id="noise" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M0 100L100 0M-50 100L50 0M50 100L150 0" stroke="#C4A37B" stroke-opacity=".022" stroke-width="1"/></pattern>
 <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
 
</defs>
<style>
 .serif{font-family:Georgia,'Noto Serif',serif; font-weight:bold}
 .mono{font-family:'Courier New',monospace; font-weight:bold}
 .small{font-family:'Courier New',monospace; letter-spacing:3px}
 @keyframes heartbeat{0%,100%{opacity:.55}50%{opacity:1}}
 @keyframes waft{0%,100%{transform:translateX(0px)}50%{transform:translateX(34px)}}
 @keyframes twinkle{0%,100%{opacity:.05}50%{opacity:.42}}
 @keyframes dash{to{stroke-dashoffset:-60}}
 @keyframes reveal{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
 .heartbeat{animation:heartbeat 5s ease-in-out infinite}.waft{animation:waft 10s ease-in-out infinite}
 .twinkle{animation:twinkle 4s ease-in-out infinite}.reveal{animation:reveal 1.8s both}
 .signal{stroke-dasharray:6 10;animation:dash 15s linear infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 
</style>
<rect width="1200" height="480" fill="url(#bg)"/><rect width="1200" height="480" fill="url(#noise)"/><rect x="35" y="25" width="365" height="425" rx="7" fill="#171116" stroke="#8A6A50" stroke-width="2"/>
 <rect x="50" y="39" width="335" height="397" rx="3" fill="none" stroke="#5D3D34" stroke-width="1"/>
 <text x="210" y="77" class="small" fill="#D0AC83" text-anchor="middle" font-size="14">EVIDENCE / 01</text>
 <text x="210" y="310" class="serif" fill="#EFE2C9" text-anchor="middle" font-size="33" letter-spacing="3">THE SUSPECT</text>
 <text x="210" y="350" class="mono" fill="#B44758" text-anchor="middle" font-size="24" letter-spacing="2">WHO?</text>
 <path d="M130 371H290" stroke="#AE8064" opacity=".6"/>
 <text x="210" y="403" fill="#B8A89A" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="20">A face among six</text><circle cx="210" cy="173" r="42" fill="#251C20" stroke="#9A634F" stroke-width="3"/><path d="M127 266Q127 209 210 216Q293 209 293 266Z" fill="#241B1F" stroke="#9A634F" stroke-width="3"/><path d="M190 131L173 143L230 131L245 143" fill="none" stroke="#9A634F" stroke-width="2"/><rect x="432" y="25" width="365" height="425" rx="7" fill="#171116" stroke="#8A6A50" stroke-width="2"/>
 <rect x="447" y="39" width="335" height="397" rx="3" fill="none" stroke="#5D3D34" stroke-width="1"/>
 <text x="607" y="77" class="small" fill="#D0AC83" text-anchor="middle" font-size="14">EVIDENCE / 02</text>
 <text x="607" y="310" class="serif" fill="#EFE2C9" text-anchor="middle" font-size="33" letter-spacing="3">THE WEAPON</text>
 <text x="607" y="350" class="mono" fill="#B44758" text-anchor="middle" font-size="24" letter-spacing="2">HOW?</text>
 <path d="M527 371H687" stroke="#AE8064" opacity=".6"/>
 <text x="607" y="403" fill="#B8A89A" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="20">One object tells all</text><path d="M592 121L631 121L623 208L641 231L617 251L594 234L609 208Z" fill="#6D3B41" stroke="#CB997C" stroke-width="3"/><path d="M547 210L665 210" stroke="#C59B78" stroke-width="9"/><circle cx="607" cy="202" r="14" fill="#2F1C21" stroke="#C59B78" stroke-width="3"/><rect x="829" y="25" width="365" height="425" rx="7" fill="#171116" stroke="#8A6A50" stroke-width="2"/>
 <rect x="844" y="39" width="335" height="397" rx="3" fill="none" stroke="#5D3D34" stroke-width="1"/>
 <text x="1004" y="77" class="small" fill="#D0AC83" text-anchor="middle" font-size="14">EVIDENCE / 03</text>
 <text x="1004" y="310" class="serif" fill="#EFE2C9" text-anchor="middle" font-size="33" letter-spacing="3">THE ROOM</text>
 <text x="1004" y="350" class="mono" fill="#B44758" text-anchor="middle" font-size="24" letter-spacing="2">WHERE?</text>
 <path d="M924 371H1084" stroke="#AE8064" opacity=".6"/>
 <text x="1004" y="403" fill="#B8A89A" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="20">Every door hides a clue</text><path d="M932 263V145Q932 105 1004 105Q1076 105 1076 145V263Z" fill="#24191D" stroke="#AB7259" stroke-width="4"/><path d="M955 263V152Q955 121 1004 121Q1053 121 1053 152V263" stroke="#7D5248" stroke-width="2" fill="none"/><circle cx="1039" cy="203" r="6" fill="#CEAA78"/>
</svg>